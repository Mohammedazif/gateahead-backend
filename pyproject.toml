[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateahead"
version = "0.3.0"
description = "GateAhead: India-wide railway crossing alerts from OSM and live train feeds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]>=21.0",
  "aiohttp>=3.9",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "pydantic>=2,<3",
  "uvicorn>=0.30",
  "openlocationcode>=1.0.1",
  "yarl>=1.9",
  "google-auth[requests]>=2.38,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
gateahead-bot = "gateahead.bot.app:main"
gateahead-catalog = "gateahead.catalog:main"
gateahead-server = "gateahead.runtime:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gateahead = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "simulator"]
testpaths = ["tests", "simulator/tests"]
