[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrail"
version = "0.3.0"
description = "India-wide railway crossing alerts from OSM and live train feeds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]>=21.0",
  "geopy>=2.4",
  "aiohttp>=3.9",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openlocationcode>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
smartrail-bot = "smartrail.bot.app:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
